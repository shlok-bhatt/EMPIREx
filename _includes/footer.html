<footer class="site-footer">
  <div class="container footer-main">
    <a class="wordmark" href="{{ '/' | relative_url }}">
      {{ site.data.site.wordmark }}<span>x</span>
      <small>{{ site.data.site.tagline }}</small>
    </a>
    <nav class="footer-links" aria-label="Footer navigation">
      {% for item in site.data.navigation.footer %}
        <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
  <div class="container footer-bottom">
    <span>{{ site.data.site.copyright }}</span>
    <span>{{ site.data.site.disclaimer }}</span>
  </div>
</footer>
