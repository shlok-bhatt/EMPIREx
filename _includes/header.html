<header class="site-header">
  <div class="container nav-wrap">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="{{ site.data.site.name }} home">
      {{ site.data.site.wordmark }}<span>x</span>
      <small>{{ site.data.site.tagline }}</small>
    </a>
    <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Open navigation">
      <span></span><span></span><span></span>
    </button>
    <nav class="primary-nav" id="primary-nav" aria-label="Main navigation">
      {% for item in site.data.navigation.primary %}
        <a href="{{ item.url | relative_url }}"{% if page.active_nav == item.key %} aria-current="page"{% endif %}{% if item.cta %} class="nav-cta"{% endif %}>{{ item.label }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
