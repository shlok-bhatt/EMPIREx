<svg xmlns="http://www.w3.org/2000/svg" width="760" height="500" viewBox="0 0 760 500"><rect width="760" height="500" rx="22" fill="#241710"/><g transform="translate(30 20)"><rect width="335" height="455" rx="16" fill="#f7f1e4" stroke="#c9a45b" stroke-width="5"/><rect x="15" y="15" width="305" height="44" rx="7" fill="#354154"/><text x="167" y="44" text-anchor="middle" fill="white" font-family="Arial" font-size="20">QUICK RULES</text><g fill="#382c20" font-family="Arial" font-size="14"><text x="25" y="100">OBJECTIVE: highest total EP after seven rounds.</text><text x="25" y="145">SETUP: Business + Ability + hidden Secret Goal</text><text x="25" y="205">EACH ROUND</text><text x="25" y="240">1. Reveal Customer and Event.</text><text x="25" y="275">2. Draw Market Pulse face down.</text><text x="25" y="310">3. Choose one of three Action options.</text><text x="25" y="345">4. Reveal Actions, then Pulse.</text><text x="25" y="405">max(0, C + E) + B + A</text></g></g><g transform="translate(395 20)"><rect width="335" height="455" rx="16" fill="#f7f1e4" stroke="#c9a45b" stroke-width="5"/><rect x="15" y="15" width="305" height="44" rx="7" fill="#354154"/><text x="167" y="44" text-anchor="middle" fill="white" font-family="Arial" font-size="20">ROUND SEQUENCE</text><g font-family="Arial" fill="#382c20"><text x="30" y="120" font-size="20">REVEAL</text><text x="30" y="150" font-size="15">Customer + Event + hidden Pulse</text><text x="30" y="235" font-size="20">CHOOSE</text><text x="30" y="265" font-size="15">Three different-category Actions</text><text x="30" y="350" font-size="20">TURN</text><text x="30" y="380" font-size="15">Reveal Actions, then the Pulse</text><text x="30" y="440" font-size="20">SCORE</text></g></g></svg>